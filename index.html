<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Workspace Staff Manager</title>
</head>

<body>

  <main class="globale_container w-[100%] h-[100%] flex flex-col items-center gap-4">
    <h1 class="bg-red-200">  Workspace Staff Manager </h1>
    <section class="main_caontainer w-[95%] h-[90vh]  min-h[100%] border ">
      <div class="flex w-[100%] h-[100%] justify-between ">
        <div id="sidebar" class="sideBar w-[29%] min-h-[100%] border flex flex-col justify-between ">
          <h2 class="text-xl  font-bold  p-[15px] m-[10px] border text-blue-800 font-serif ">Staff Members</h2>
        
          <div id="stock" class="overflow-y-auto h-[70vh] px-2">


          </div>
          <div class="flex justify-center p-4 border-t ">
            <button id="btn-add"
              class="font-sans text-md font-semibold border-[2px] h-8 w-36 rounded-lg bg-blue-500  text-white text-center ">Add
              New Worker </button>

          </div>

        </div>

        <div class=" w-[70%] h-[100%] border flex items-center">
          <div class="pecture w-[100%] h-[90%]">
            <div  class="gallery-item item1 text-center ">
              <p>Conference-room</p>
              <div class="room-workers"></div>
              <button  class="add-item "> + </button>
             
            </div>
            <div class="gallery-item item2 text-center ">
              <p>Server-Room</p>
              <div class="room-workers"></div>
              <button class="add-item" > + </button>
            
            </div>
            <div class="gallery-item item3 text-center ">
           
              <p>Security-room </p>
              <div class="room-workers"></div>
              <button  class="add-item"> + </button>
            
            </div>
            <div class="gallery-item item4 text-center ">
              <p>Réception-room </p>
              <div class="room-workers"></div>
              <button class="add-item"> + </button>
             
            </div>
            <div class="gallery-item item5 text-center">
              <p>Staff-room </p>
              <div class="room-workers"></div>
              <button class="add-item"> + </button>
              
            </div>
            <div class="gallery-item item6 text-center">
              <p>Vault </p>
              <div class="room-workers"></div>
              <button class="add-item"> + </button>
             
            </div>
          </div>
        
        </div>
      </div>

     
    </section>
  </main>
  <!-- MODAL ADD WORKER -->
<div id="modal-add" class="fixed inset-0 bg-black/50 hidden justify-center items-center">
  <div class="bg-white p-6 rounded-lg w-full max-w-sm max-h-[100vh] overflow-y-auto">

    <!-- Close Button -->
    <button id="close-modal" class="absolute right-3 top-3 text-red-500 font-bold text-xl">X</button>

    <h2 class="text-xl font-bold text-center mb-4">Add New Worker</h2>

    <!-- Form -->
    <form id="add-worker-form" class="flex flex-col gap-3">

      <div>
        <label class="font-semibold">Name</label>
        <input id="name" type="text" class="border p-2 w-full" >
        <p  id="name-error" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label class="font-semibold">Role</label>
        <select id="role" class="border p-2 w-full" >
        <p  id="role-error" class="text-red-500 text-sm"></p>
          <option value="">-- Select --</option>
          <option value="Manager">Manager</option>
          <option value="Receptionniste">Receptionniste</option>
          <option value="Technicien IT">Technicien IT</option>
          <option value="Agent Sécurité">Agent Sécurité</option>
          <option value="Nettoyage">Nettoyage</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
              
      <div>
        <label class="font-semibold">Photo URL</label>
        <input id="photo" type="text" class="border p-2 w-full">
        <p  id="photo-error" class="text-red-500 text-sm"></p>
      </div>
      <!-- Preview Photo -->
          <img id = "preview" class = "w-24 h-24 rounded-full object-cover border mx-auto " 
              src= "" alt = "vide" />
      <div>
        <label class="font-semibold">Email</label>
        <input id="email" type="email" class="border p-2 w-full" >
        <p  id="email-error" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label class="font-semibold">Téléphone</label>
        <input type="text" id="tel" class="border p-2 w-full" > 

        <p  id="tel-error" class="text-red-500 text-sm"></p>
       
      </div>

      <!-- expériences dynamiques -->
      <div id="exp-list" class="flex flex-col gap-2 ">
       
         
      </div>
      <button type="button" id="add-exp" class="bg-green-500 text-white p-1 rounded ">
        + Add Experience
      </button>
      
      <button  id="save" class="bg-blue-600 text-white p-2 rounded mt-3">Save Worker</button>

    </form>
</div>
</div>


          <!-- MODAL FOR CARD Server-Room -->
          <div  id="modal-room" class="fixed w-[350px] h-[85vh] bg-gray-100 rounded-[12px] top-[50%] left-[50%] flex flex-col items-center gap-[10px] translate-x-[-50%] translate-y-[-50%] shadow-lg hidden overflow-y-auto   ">
          <div  class="flex justify-between w-[90%] border-b-2 p-3 ">
          <h2 class=" text-md font-bold text-blue-500"> Assign Worker to Room</h2>
          <button id="close-modal-room" class="text-red-500 font-bold text-md hover:scale-110">X</button>

           </div>
           <div id="room-stock" class="flex flex-col gap-3 ">
           </div> 
           </div> 
          
 

</body>

</html>
